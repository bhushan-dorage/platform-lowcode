spring:
  application:
    name: platform-studio-backend
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/platform}
    username: ${DATASOURCE_USERNAME:platform}
    password: ${DATASOURCE_PASSWORD:platform}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: platform_meta
  flyway:
    enabled: true
    locations: classpath:db/migration/platform_meta
    schemas: platform_meta
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      transaction-id-prefix: studio-backend-tx-
    properties:
      enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/platform}

studio:
  git:
    repos-path: ${STUDIO_GIT_REPOS_PATH:/var/platform/git-repos}

keycloak:
  token-url: ${KEYCLOAK_TOKEN_URL:http://localhost:8080/realms/platform/protocol/openid-connect/token}
  client-id: ${KEYCLOAK_CLIENT_ID:platform-api}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:platform-api-secret}

runtime-services:
  form-service:
    base-url: ${FORM_SERVICE_BASE_URL:http://localhost:8080}
  data-service:
    base-url: ${DATA_SERVICE_BASE_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

server:
  port: 8086
