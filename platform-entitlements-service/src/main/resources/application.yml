spring:
  application:
    name: platform-entitlements-service
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/platform}
    username: ${DATASOURCE_USERNAME:platform}
    password: ${DATASOURCE_PASSWORD:platform}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: platform_meta
  flyway:
    enabled: true
    locations: classpath:db/migration/platform_meta
    schemas: platform_meta
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: caffeine
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/platform}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

server:
  port: 8085
