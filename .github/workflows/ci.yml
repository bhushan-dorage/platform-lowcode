name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  build-platform-bom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Build platform-bom
        working-directory: platform-bom
        run: mvn -B install -DskipTests

  build-platform-common:
    needs: build-platform-bom
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Install platform-bom
        working-directory: platform-bom
        run: mvn -B install -DskipTests
      - name: Test platform-common
        working-directory: platform-common
        run: mvn -B verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/platform
          DB_USER: platform
          DB_PASSWORD: platform
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  build-platform-audit-service:
    needs: [build-platform-bom, build-platform-common]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Install platform-bom
        working-directory: platform-bom
        run: mvn -B install -DskipTests
      - name: Install platform-common
        working-directory: platform-common
        run: mvn -B install -DskipTests
      - name: Test platform-audit-service
        working-directory: platform-audit-service
        run: mvn -B verify

  lint-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        run: docker compose config --quiet
      - name: Validate Kong config
        run: |
          docker run --rm \
            -e KONG_DATABASE=off \
            -v ${{ github.workspace }}/infra/kong:/kong kong:3.6 \
            kong config parse /kong/kong.yaml
